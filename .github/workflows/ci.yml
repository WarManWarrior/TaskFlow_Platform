
name: TaskFlow CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Jobs receive read-only repository access by default. Only the GitOps image-tag
# update job needs write access to commit the generated manifest changes.
permissions:
  contents: read

# Avoid concurrent main-branch builds racing to update the same GitOps manifests.
concurrency:
  group: taskflow-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  quality-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_NAME: taskflow
      DB_USER: taskflow_user
      DB_PASSWORD: ci_taskflow_password
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: ci_taskflow_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow_user -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Run Backend Tests
        working-directory: backend
        run: bash ./mvnw -B test

  build-and-push:
    needs: quality-checks
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Image Tag
        id: generate_tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ env.IMAGE_TAG }}

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ env.IMAGE_TAG }}

      - name: Update Kubernetes Manifests
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: .*/taskflow-backend:.*|image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ env.IMAGE_TAG }}|" k8s-manifests/backend-deployment.yaml
          sed -i "s|image: .*/taskflow-frontend:.*|image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ env.IMAGE_TAG }}|" k8s-manifests/frontend-deployment.yaml

      - name: Commit and Push GitOps Changes
        if: github.event_name == 'push'
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -e
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

          # A duplicate or older run may finish building after another run has
          # moved the branch. Inspect the current remote branch before editing.
          git fetch origin "$TARGET_BRANCH"
          git reset --hard "origin/$TARGET_BRANCH"

          # Never roll GitOps backwards to an image from an older source commit.
          if [ "$(git rev-parse HEAD)" != "$GITHUB_SHA" ]; then
            if grep -Fq "taskflow-backend:$IMAGE_TAG" k8s-manifests/backend-deployment.yaml \
              && grep -Fq "taskflow-frontend:$IMAGE_TAG" k8s-manifests/frontend-deployment.yaml; then
              echo "This image tag is already recorded in both manifests; nothing to do."
            else
              echo "Branch advanced from $GITHUB_SHA while this build ran; skipping stale manifest update."
            fi
            exit 0
          fi

          sed -i "s|image: .*/taskflow-backend:.*|image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ env.IMAGE_TAG }}|" k8s-manifests/backend-deployment.yaml
          sed -i "s|image: .*/taskflow-frontend:.*|image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:${{ env.IMAGE_TAG }}|" k8s-manifests/frontend-deployment.yaml

          git add k8s-manifests/backend-deployment.yaml k8s-manifests/frontend-deployment.yaml
          if git diff --cached --quiet; then
            echo "Both manifests already use image tag $IMAGE_TAG."
            exit 0
          fi

          git commit -m "cd: update frontend and backend image tags to $IMAGE_TAG [skip ci]"
          if ! git push origin "HEAD:$TARGET_BRANCH"; then
            # Don't force-push or overwrite a concurrent remote update.
            echo "The branch changed during the final push; rerun this workflow to reconcile GitOps."
            exit 1
          fi
