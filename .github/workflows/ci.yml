
name: TaskFlow CI Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Image Tag
        id: generate_tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: \${{ secrets.DOCKERHUB_USERNAME }}
          password: \${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: \${{ github.event_name == 'push' }}
          tags: |
            \${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest
            \${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:\${{ env.IMAGE_TAG }}

      - name: Build Backend Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: \${{ github.event_name == 'push' }}
          tags: |
            \${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest
            \${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:\${{ env.IMAGE_TAG }}

      - name: Update Kubernetes Manifests
        if: github.event_name == 'push'
        run: |
          sed -i "s|image: .*/taskflow-backend:.*|image: docker.io/\${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:\${{ env.IMAGE_TAG }}|" k8s-manifests/backend-deployment.yaml
          sed -i "s|image: .*/taskflow-frontend:.*|image: docker.io/\${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:\${{ env.IMAGE_TAG }}|" k8s-manifests/frontend-deployment.yaml

      - name: Commit and Push GitOps Changes
        if: github.event_name == 'push'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add k8s-manifests/backend-deployment.yaml k8s-manifests/frontend-deployment.yaml
          if ! git diff --cached --quiet; then
            git commit -m "cd: update frontend and backend image tags to \${{ env.IMAGE_TAG }} [skip ci]"
            git push origin HEAD:\${{ github.ref_name }}
          else
            echo "No manifest changes to commit."
          fi
