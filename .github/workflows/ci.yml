name: TaskFlow CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        # Only log in if we are merging to main
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          # Only push the image to Docker Hub if we are on main
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-frontend:latest

      - name: Build and Push Backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: ${{ github.event_name == 'push' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:latest

      # --- NEW GITOPS STEPS BELOW ---

      # 1. We need a unique tag for the image based on the Git commit hash
      - name: Generate Image Tag
        id: generate_tag
        run: echo "IMAGE_TAG=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      # 2. Update the Kubernetes manifest with the new image tag using 'sed'
      - name: Update Kubernetes Manifest
        run: |
          sed -i "s|image: .*/taskflow-backend:.*|image: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-backend:${{ env.IMAGE_TAG }}|g" k8s-manifests/backend-deployment.yaml

      # 3. Commit the change back to the GitHub repository
      - name: Commit and Push GitOps changes
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add k8s-manifests/backend-deployment.yaml
          git commit -m "cd: update backend image tag to ${{ env.IMAGE_TAG }} [skip ci]"
          git push origin HEAD:${{ github.ref }}