apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: taskflow-traefik-ingress
  namespace: default
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - taskflowteams.duckdns.org
      secretName: taskflowteams-tls
  rules:
    - host: taskflowteams.duckdns.org
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: taskflow-backend
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: taskflow-frontend
                port:
                  number: 80
