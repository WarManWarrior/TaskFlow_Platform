# ----------------------------------------
# GENERAL APP CONFIGURATION
# ----------------------------------------
spring.application.name=taskflow-backend
server.port=8080

# ----------------------------------------
# DATABASE CONNECTION
# Supply DB_PASSWORD through a protected environment variable or secret.
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
spring.datasource.username=${DB_USER:taskflow_user}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# HIBERNATE / JPA SETTINGS
# ----------------------------------------
# 'update' automatically creates/updates database tables based on your Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Expose health endpoints for Kubernetes probes
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
# Store servlet sessions in PostgreSQL so every backend replica sees the same login.
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.schema=classpath:session-schema-postgresql.sql
spring.session.timeout=12h
