# ----------------------------------------
# GENERAL APP CONFIGURATION
# ----------------------------------------
spring.application.name=taskflow-backend
server.port=8080

# ----------------------------------------
# DATABASE CONNECTION
# Syntax: ${ENVIRONMENT_VARIABLE:default_value}
# ----------------------------------------
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:taskflow}
spring.datasource.username=${DB_USER:taskflow_user}
spring.datasource.password=${DB_PASSWORD:super_secret_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# ----------------------------------------
# HIBERNATE / JPA SETTINGS
# ----------------------------------------
# 'update' automatically creates/updates database tables based on your Java code
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect